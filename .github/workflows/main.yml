name: Run Server 24-7

on:
  schedule:
    # Автоматически перезапускать каждые 5 часов, чтобы GitHub не отключал сервер
    - cron: '0 */5 * * *'
  workflow_dispatch: # Возможность запустить вручную

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run Server
        run: node server.js
